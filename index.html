<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hearth</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a; --text:#e6e8ec; --dim:#9aa3b2; --accent:#5b8cff; --me:#243049; --mention:#3a2f12; --green:#3ecf8e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100dvh; }
  button { cursor:pointer; border:none; border-radius:8px; padding:8px 12px; background:var(--accent); color:#fff; font-weight:600; }
  button.ghost { background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  button.icon { background:transparent; color:var(--dim); padding:3px 6px; font-size:13px; border-radius:6px; }
  button.icon:hover { background:var(--panel2); color:var(--text); }
  input, textarea { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 11px; font:inherit; width:100%; }
  .row { display:flex; gap:8px; align-items:center; }
  .center { max-width:380px; margin:8vh auto; padding:24px; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  .center h1 { margin:0 0 4px; font-size:22px; } .center p { color:var(--dim); margin:0 0 16px; }
  .muted { color:var(--dim); font-size:12px; } .hidden { display:none !important; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; }
  /* layout */
  header { display:flex; align-items:center; gap:10px; padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
  header .sp { flex:1; }
  main { flex:1; display:flex; min-height:0; }
  nav { width:210px; background:var(--panel); border-right:1px solid var(--line); overflow:auto; flex:none; padding:8px; }
  nav h3 { font-size:10px; text-transform:uppercase; color:var(--dim); margin:12px 8px 4px; letter-spacing:.6px; display:flex; justify-content:space-between; }
  .chan { padding:5px 9px; border-radius:7px; color:var(--dim); cursor:pointer; display:flex; align-items:center; gap:6px; font-size:14px; }
  .chan:hover { background:var(--panel2); } .chan.active { background:var(--me); color:var(--text); }
  .chan .badge { margin-left:auto; background:var(--accent); color:#fff; font-size:10px; font-weight:700; border-radius:9px; padding:1px 6px; }
  .chan.unread { color:var(--text); font-weight:600; }
  section.msgs { flex:1; display:flex; flex-direction:column; min-width:0; }
  #messages { flex:1; overflow:auto; padding:12px 8px; }
  .msg { padding:3px 10px; border-radius:8px; position:relative; }
  .msg:hover { background:var(--panel); }
  .msg .who { font-weight:700; margin-right:8px; } .msg .t { color:var(--dim); font-size:11px; }
  .msg.me { background:var(--me); } .msg.mention { background:var(--mention); }
  .msg .body { white-space:pre-wrap; word-break:break-word; } .msg .body .tag { color:var(--accent); font-weight:600; }
  .msg .actions { position:absolute; top:-10px; right:8px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; display:none; }
  .msg:hover .actions { display:flex; }
  .rxns { display:flex; gap:4px; flex-wrap:wrap; margin:2px 0 0; }
  .rxn { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:0 7px; font-size:12px; cursor:pointer; }
  .rxn.mine { border-color:var(--accent); background:#22304d; }
  .threadind { color:var(--accent); font-size:12px; cursor:pointer; margin-top:2px; display:inline-block; }
  .threadind:hover { text-decoration:underline; }
  .edited { color:var(--dim); font-size:11px; }
  #typing { height:16px; padding:0 16px; color:var(--dim); font-size:12px; }
  footer { padding:10px 12px; border-top:1px solid var(--line); background:var(--panel); position:relative; }
  footer textarea { resize:none; height:42px; }
  /* right panel */
  aside { width:340px; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; flex:none; }
  aside.hidden { display:none; }
  aside header { border-bottom:1px solid var(--line); }
  aside .content { flex:1; overflow:auto; padding:10px; }
  .member { padding:5px 6px; color:var(--dim); font-size:13px; display:flex; align-items:center; gap:7px; cursor:pointer; border-radius:6px; }
  .member:hover { background:var(--panel2); }
  .sr { padding:8px; border-bottom:1px solid var(--line); cursor:pointer; } .sr:hover { background:var(--panel2); }
  /* emoji + mention popups */
  .pop { position:absolute; bottom:56px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px; z-index:20; box-shadow:0 8px 30px #0008; }
  .emoji { font-size:20px; padding:4px 6px; cursor:pointer; border-radius:6px; } .emoji:hover { background:var(--me); }
  .mrow { padding:6px 10px; cursor:pointer; border-radius:6px; } .mrow:hover, .mrow.sel { background:var(--me); }
  /* voice */
  #voicebar { background:#14251d; border-top:1px solid #1f4436; padding:8px 12px; display:flex; align-items:center; gap:10px; flex:none; }
  #voicebar.hidden { display:none; }
  .vpart { display:inline-flex; align-items:center; gap:5px; background:#1e222b; border-radius:14px; padding:2px 9px; margin-right:6px; font-size:12px; }
  .vpart.speaking { box-shadow:0 0 0 2px var(--green); }
  .chan .live { margin-left:auto; color:var(--green); font-size:10px; font-weight:700; }
  @media (max-width:820px){ aside{ position:fixed; right:0; top:0; bottom:0; z-index:30; } nav{ width:170px; } }
</style>
</head>
<body>
<div id="app">
  <!-- AUTH -->
  <div id="auth" class="center">
    <h1>Hearth</h1>
    <p>Threads, reactions, DMs, search, voice. Open in two tabs to see realtime.</p>
    <div class="row" style="margin-bottom:10px"><input id="name" placeholder="Your display name" maxlength="40" /></div>
    <button id="guestBtn" style="width:100%; margin-bottom:16px">Continue as guest</button>
    <div class="muted" style="text-align:center; margin-bottom:10px">or sign in with email + OTP</div>
    <div class="row" style="margin-bottom:8px"><input id="email" type="email" placeholder="you@email.com" /></div>
    <button id="otpSend" class="ghost" style="width:100%">Email me a code</button>
    <div id="otpVerify" class="hidden" style="margin-top:12px">
      <div class="row" style="margin-bottom:8px"><input id="code" placeholder="Enter the code" inputmode="numeric" /></div>
      <button id="otpVerifyBtn" style="width:100%">Verify and sign in</button>
      <p class="muted" style="margin-top:8px">Demo email is rate limited; if it does not arrive, use guest.</p>
    </div>
    <div id="authErr" class="muted" style="color:#ff8080; margin-top:10px"></div>
  </div>

  <!-- CHAT -->
  <div id="chat" class="hidden" style="display:flex; flex-direction:column; height:100%">
    <header>
      <strong id="hdr">#general</strong>
      <span class="muted" id="hdrtopic"></span>
      <span class="sp"></span>
      <button class="icon" id="btnSearch" title="Search">Search</button>
      <button class="icon" id="btnPins" title="Pinned">Pins</button>
      <button class="icon" id="btnMembers" title="Members"><span class="dot"></span> <span id="onlineCount">1</span></button>
      <span class="muted" id="meName" style="margin:0 8px"></span>
      <button class="ghost" id="signout" style="padding:5px 9px">Sign out</button>
    </header>
    <div id="voicebar" class="hidden">
      <strong style="color:var(--green)">Voice:</strong> <span id="vchanName"></span>
      <span id="vparts"></span>
      <span class="sp"></span>
      <button class="ghost" id="vmute" style="padding:5px 9px">Mute</button>
      <button id="vleave" style="padding:5px 9px; background:#b3402f">Leave</button>
    </div>
    <main>
      <nav>
        <div id="channels"></div>
      </nav>
      <section class="msgs">
        <div id="messages"></div>
        <div id="typing"></div>
        <footer>
          <div id="pop" class="pop hidden"></div>
          <textarea id="composer" placeholder="Message"></textarea>
        </footer>
      </section>
      <aside id="panel" class="hidden">
        <header><strong id="panelTitle">Thread</strong><span class="sp"></span><button class="icon" id="panelClose">Close</button></header>
        <div class="content" id="panelContent"></div>
        <footer id="panelFooter" class="hidden"><textarea id="threadComposer" placeholder="Reply in thread" style="resize:none;height:42px"></textarea></footer>
      </aside>
    </main>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.58.0';
const SUPABASE_URL='https://ybddogqphinruyunnuwx.supabase.co';
const PUBLISHABLE='sb_publishable_5gyvKj8AtZeXGDWVLYg3VA_Uwh4T4RD';
const DEMO_TOKEN='hearth-demo-open-2026';
const EMOJIS=['👍','❤️','😂','🎉','🔥','👀','✅','🙏','😮','😢','🚀','💯'];
const sb=createClient(SUPABASE_URL,PUBLISHABLE,{auth:{autoRefreshToken:true,persistSession:true},realtime:{params:{eventsPerSecond:30}}});
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=t=>esc(t).replace(/(^|\s)(@[\w]+)/g,'$1<span class="tag">$2</span>');
const timeOf=d=>new Date(d||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

let me=null, ws=null, channels=[], current=null, currentDM=null;
const profiles=new Map(); const seen=new Set(); const rootThreads=new Map(); // rootMsgId -> {threadId, count}
let chanSub=null, typSub=null, userSub=null, dmSub=null;
let panelMode=null, panelThread=null;
let chanCursor=0;
// periodic reconcile: catch any live broadcast missed under at-most-once delivery
setInterval(reconcileChannel, 6000);
// periodic rail refresh so new DMs + unread badges appear without a live signal
setInterval(()=>{ if(ws) renderChannels(); }, 10000);
async function reconcileChannel(){ if(!current) return;
  const {data}=await sb.from('messages').select('*').eq('channel_id',current.id).gt('seq',chanCursor).order('seq').limit(100);
  if(!data||!data.length) return;
  for(const m of data){ chanCursor=Math.max(chanCursor,m.seq);
    if(m.thread_id&&!rootThreads.has(m.id)){ bumpThread(m.thread_id); if(panelMode==='thread'&&panelThread&&panelThread.id===m.thread_id) appendThreadMsg(m); continue; }
    renderMsg(m); }
  loadReactions(data.map(m=>m.id)); scrollDown(); }

// ---------------- auth ----------------
$('guestBtn').onclick=async()=>{ const name=$('name').value.trim()||'Guest '+Math.floor(Math.random()*9000+1000); busy(true);
  const {error}=await sb.auth.signInAnonymously(); if(error) return err(error.message);
  await sb.rpc('set_profile',{p_display_name:name,p_avatar_key:null,p_pronouns:null,p_status_text:null,p_status_emoji:null,p_timezone:'Asia/Kolkata'}); enter(); };
$('otpSend').onclick=async()=>{ const email=$('email').value.trim(); if(!email) return err('Enter an email'); busy(true,'otp');
  const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}}); busy(false,'otp'); if(error) return err(error.message); $('otpVerify').classList.remove('hidden'); err(''); };
$('otpVerifyBtn').onclick=async()=>{ const email=$('email').value.trim(),token=$('code').value.trim(); busy(true);
  const {error}=await sb.auth.verifyOtp({email,token,type:'email'}); if(error) return err(error.message);
  const n=$('name').value.trim(); if(n) await sb.rpc('set_profile',{p_display_name:n,p_avatar_key:null,p_pronouns:null,p_status_text:null,p_status_emoji:null,p_timezone:'Asia/Kolkata'}); enter(); };
$('signout').onclick=async()=>{ if(voice.active) leaveVoice(); await sb.auth.signOut(); location.reload(); };
function err(m){ $('authErr').textContent=m; busy(false); busy(false,'otp'); }
function busy(b,w){ const el=w==='otp'?$('otpSend'):$('guestBtn'); el.disabled=b; el.textContent=b?'...':(w==='otp'?'Email me a code':'Continue as guest'); }

// ---------------- enter ----------------
async function enter(){
  const {data:{session}}=await sb.auth.getSession(); if(!session) return err('No session');
  me=session.user.id; sb.realtime.setAuth(session.access_token);
  const {error:je}=await sb.rpc('redeem_invite',{p_token:DEMO_TOKEN}); void je;
  const {data:wsRows}=await sb.from('workspaces').select('*').limit(1); ws=wsRows&&wsRows[0]; if(!ws) return err('No demo space');
  await loadMembers();
  $('auth').classList.add('hidden'); $('chat').classList.remove('hidden');
  $('meName').textContent=profiles.get(me)?.display_name||'you';
  await loadChannels();
  subUser(session.access_token); heartbeat(); presenceLoop();
  const gen=channels.find(c=>c.name==='general'&&c.kind!=='voice')||channels.find(c=>c.kind!=='voice'); if(gen) openChannel(gen);
}
async function loadMembers(){
  const {data:mem}=await sb.from('workspace_members').select('user_id').eq('workspace_id',ws.id);
  const ids=(mem||[]).map(m=>m.user_id);
  if(ids.length){ const {data:pr}=await sb.from('profiles').select('id,display_name,username').in('id',ids); (pr||[]).forEach(p=>profiles.set(p.id,p)); }
}
async function loadChannels(){
  const {data:chs}=await sb.from('channels').select('*').eq('workspace_id',ws.id).order('position');
  channels=chs||[]; await renderChannels();
}
async function renderChannels(){
  const {data:unread}=await sb.rpc('get_unread',{p_workspace:ws.id}).then(r=>({data:r.data||[]})).catch(()=>({data:[]}));
  const um=new Map((unread||[]).map(u=>[u.scope_id,u]));
  const text=channels.filter(c=>c.kind!=='voice'), voice=channels.filter(c=>c.kind==='voice');
  const {data:convs}=await sb.from('conversations').select('id,kind').eq('workspace_id',ws.id);
  let h='<h3>Channels</h3>';
  for(const c of text){ const u=um.get(c.id); const un=u&&u.unread; const mc=u&&u.mention_count;
    h+=`<div class="chan ${current&&c.id===current.id?'active':''} ${un?'unread':''}" data-ch="${c.id}"># ${esc(c.name)}${mc?`<span class="badge">${mc}</span>`:(un?'<span class="badge">•</span>':'')}</div>`; }
  h+='<h3>Voice</h3>';
  for(const c of voice){ const live=voice.parts&&voice.parts[c.id]; h+=`<div class="chan" data-voice="${c.id}">🔊 ${esc(c.name)}<span class="live" id="vlive-${c.id}"></span></div>`; }
  h+='<h3>Direct messages</h3>';
  for(const cv of (convs||[])){ const other=await dmOther(cv.id); h+=`<div class="chan ${currentDM===cv.id?'active':''}" data-dm="${cv.id}">@ ${esc(other)}</div>`; }
  h+='<div class="chan" data-newdm="1" style="color:var(--accent)">+ New DM</div>';
  $('channels').innerHTML=h;
  $('channels').querySelectorAll('[data-ch]').forEach(el=>el.onclick=()=>openChannel(channels.find(c=>c.id===el.dataset.ch)));
  $('channels').querySelectorAll('[data-voice]').forEach(el=>el.onclick=()=>joinVoice(channels.find(c=>c.id===el.dataset.voice)));
  $('channels').querySelectorAll('[data-dm]').forEach(el=>el.onclick=()=>openDM(el.dataset.dm));
  $('channels').querySelectorAll('[data-newdm]').forEach(el=>el.onclick=newDM);
  updateVoiceCounts();
}
async function dmOther(convId){ const {data}=await sb.from('conversation_members').select('user_id').eq('conversation_id',convId);
  const others=(data||[]).map(m=>m.user_id).filter(u=>u!==me); if(!others.length) return 'me';
  return others.map(u=>profiles.get(u)?.display_name||'user').join(', '); }

// ---------------- channels + messages ----------------
async function openChannel(c){
  if(!c) return; current=c; currentDM=null; seen.clear(); rootThreads.clear(); closePanel();
  $('hdr').textContent='# '+c.name; $('hdrtopic').textContent=c.topic||''; $('composer').placeholder='Message #'+c.name;
  renderChannels();
  $('messages').innerHTML='<div class="muted" style="padding:20px">loading...</div>';
  // load threads map for this channel
  const {data:threads}=await sb.from('threads').select('id,root_message_id,reply_count').eq('channel_id',c.id);
  (threads||[]).forEach(t=>{ if(t.root_message_id) rootThreads.set(t.root_message_id,{threadId:t.id,count:t.reply_count}); });
  const {data:msgs,error}=await sb.rpc('get_channel_messages',{p_channel:c.id,p_limit:50});
  if(error){ $('messages').innerHTML=`<div class="muted" style="padding:20px">${esc(error.message)}</div>`; return; }
  const ordered=(msgs||[]).slice().reverse(); $('messages').innerHTML='';
  for(const m of ordered) if(!m.thread_id||rootThreads.has(m.id)) renderMsg(m); // hide pure thread replies from main view
  await loadReactions(ordered.map(m=>m.id));
  chanCursor=ordered.length?ordered[ordered.length-1].seq:0;
  scrollDown();
  if(ordered.length) sb.rpc('mark_read',{p_scope_type:'channel',p_scope_id:c.id,p_up_to_seq:ordered[ordered.length-1].seq});
  subscribeChannel(c);
}
function subscribeChannel(c){
  if(chanSub) sb.removeChannel(chanSub); if(typSub) sb.removeChannel(typSub);
  chanSub=sb.channel('ch:'+c.id,{config:{private:true}});
  chanSub.on('broadcast',{event:'msg'},({payload})=>onIncoming(payload));
  chanSub.on('broadcast',{event:'edit'},({payload})=>{ const el=$('m'+payload.id); if(el) el.querySelector('.body').innerHTML=fmt(payload.body_text)+' <span class="edited">(edited)</span>'; });
  chanSub.on('broadcast',{event:'delete'},({payload})=>{ const el=$('m'+payload.message_id); if(el) el.remove(); });
  chanSub.on('broadcast',{event:'reaction'},({payload})=>applyReaction(payload));
  chanSub.on('broadcast',{event:'thread_created'},({payload})=>{ if(payload.root_message_id){ rootThreads.set(payload.root_message_id,{threadId:payload.id,count:payload.reply_count||0}); const el=$('th-'+payload.root_message_id); if(el){ el.style.display=''; el.textContent=`💬 ${payload.reply_count||0} replies`; } } });
  chanSub.on('broadcast',{event:'voice_join'},()=>{ refreshVoice(); });
  chanSub.on('broadcast',{event:'voice_leave'},()=>{ refreshVoice(); });
  chanSub.subscribe();
  typSub=sb.channel('typ:'+c.id,{config:{private:true,broadcast:{self:false}}});
  typSub.on('broadcast',{event:'typing'},({payload})=>showTyping(payload.name)); typSub.subscribe();
}
function onIncoming(m){
  if(m.channel_id!==current?.id) return;
  if(m.seq) chanCursor=Math.max(chanCursor,m.seq);
  if(m.thread_id && !rootThreads.has(m.id)){ // a thread reply
    bumpThread(m.thread_id);
    if(panelMode==='thread'&&panelThread&&panelThread.id===m.thread_id) appendThreadMsg(m);
    return;
  }
  renderMsg(m); scrollDown();
  sb.rpc('mark_read',{p_scope_type:'channel',p_scope_id:current.id,p_up_to_seq:m.seq});
}
function renderMsg(m){
  const nonce=m.client_msg_id;
  if(nonce&&seen.has('n:'+nonce)){ const ex=$('m'+nonce); if(ex){ex.classList.remove('pending'); if(m.id) ex.id='m'+m.id;} if(m.id) seen.add(m.id); return; }
  if(m.id&&seen.has(m.id)) return; if(m.id) seen.add(m.id); if(nonce) seen.add('n:'+nonce);
  const who=profiles.get(m.author_id)?.display_name||profiles.get(m.author_id)?.username||'someone';
  const mentioned=Array.isArray(m.mention_user_ids)&&m.mention_user_ids.includes(me);
  const el=document.createElement('div'); el.className='msg'+(m.author_id===me?' me':'')+(mentioned?' mention':''); if(m.id) el.id='m'+m.id;
  const th=rootThreads.get(m.id);
  el.innerHTML=`<div class="actions">
      <button class="icon" data-act="react">😊</button>
      <button class="icon" data-act="thread">Thread</button>
      <button class="icon" data-act="pin">Pin</button>
      ${m.author_id===me?'<button class="icon" data-act="edit">Edit</button><button class="icon" data-act="del">Del</button>':''}
    </div>
    <span class="who">${esc(who)}</span><span class="t">${timeOf(m.created_at)}</span>
    <div class="body">${fmt(m.body_text)}${m.edited_at?' <span class="edited">(edited)</span>':''}</div>
    <div class="rxns" id="rx-${m.id}"></div>
    <span class="threadind" id="th-${m.id}" style="${th?'':'display:none'}">💬 ${th?th.count:0} replies</span>`;
  $('messages').appendChild(el);
  el.querySelector('[data-act="react"]').onclick=e=>openEmoji(e,m.id);
  el.querySelector('[data-act="thread"]').onclick=()=>openThread(m);
  el.querySelector('[data-act="pin"]').onclick=()=>sb.rpc('pin_message',{p_message:m.id});
  el.querySelector('#th-'+m.id).onclick=()=>openThread(m);
  const ed=el.querySelector('[data-act="edit"]'); if(ed) ed.onclick=()=>editMsg(m);
  const dl=el.querySelector('[data-act="del"]'); if(dl) dl.onclick=()=>sb.rpc('delete_message',{p_message:m.id});
}
function bumpThread(threadId){ for(const [root,t] of rootThreads){ if(t.threadId===threadId){ t.count++; const el=$('th-'+root); if(el){el.style.display=''; el.textContent=`💬 ${t.count} replies`;} return; } } }

// reactions
async function loadReactions(ids){ ids=ids.filter(Boolean); if(!ids.length) return;
  const {data}=await sb.from('message_reactions').select('message_id,emoji,user_id').in('message_id',ids);
  const by=new Map(); (data||[]).forEach(r=>{ const k=r.message_id+'|'+r.emoji; if(!by.has(k)) by.set(k,{message_id:r.message_id,emoji:r.emoji,users:[]}); by.get(k).users.push(r.user_id); });
  const perMsg=new Map(); for(const v of by.values()){ if(!perMsg.has(v.message_id)) perMsg.set(v.message_id,[]); perMsg.get(v.message_id).push(v); }
  for(const [mid,list] of perMsg) renderRxns(mid,list);
}
const rxnState=new Map(); // messageId -> Map(emoji -> Set(users))
function applyReaction({message_id,emoji,user_id,added}){
  if(!rxnState.has(message_id)) rxnState.set(message_id,new Map());
  const em=rxnState.get(message_id); if(!em.has(emoji)) em.set(emoji,new Set());
  if(added) em.get(emoji).add(user_id); else { em.get(emoji).delete(user_id); if(!em.get(emoji).size) em.delete(emoji); }
  renderRxnsFromState(message_id);
}
function renderRxns(mid,list){ const em=new Map(); list.forEach(v=>em.set(v.emoji,new Set(v.users))); rxnState.set(mid,em); renderRxnsFromState(mid); }
function renderRxnsFromState(mid){ const el=$('rx-'+mid); if(!el) return; const em=rxnState.get(mid)||new Map(); let h='';
  for(const [emoji,users] of em){ if(!users.size) continue; h+=`<span class="rxn ${users.has(me)?'mine':''}" data-e="${emoji}">${emoji} ${users.size}</span>`; }
  el.innerHTML=h; el.querySelectorAll('.rxn').forEach(s=>s.onclick=()=>toggleReactionLocal(mid,s.dataset.e)); }
// optimistic toggle: reflect locally now, then persist (broadcast echo reconciles others)
function toggleReactionLocal(mid,emoji){ const em=rxnState.get(mid); const has=em&&em.get(emoji)&&em.get(emoji).has(me);
  applyReaction({message_id:mid,emoji,user_id:me,added:!has}); sb.rpc('toggle_reaction',{p_message:mid,p_emoji:emoji}).catch(()=>{}); }

function openEmoji(e,mid){ const p=$('pop'); p.innerHTML=EMOJIS.map(x=>`<span class="emoji" data-e="${x}">${x}</span>`).join('');
  p.classList.remove('hidden'); p.style.left='12px';
  p.querySelectorAll('.emoji').forEach(s=>s.onclick=()=>{ toggleReactionLocal(mid,s.dataset.e); p.classList.add('hidden'); }); }
document.addEventListener('click',e=>{ if(!e.target.closest('#pop')&&!e.target.closest('[data-act="react"]')&&!e.target.closest('#composer')) $('pop').classList.add('hidden'); });

async function editMsg(m){ const t=prompt('Edit message',m.body_text); if(t==null) return; await sb.rpc('edit_message',{p_message:m.id,p_body:{text:t},p_body_text:t}); }

// ---------------- threads (right panel) ----------------
async function openThread(m){
  let t=rootThreads.get(m.id);
  if(!t){ const {data,error}=await sb.rpc('create_thread',{p_root_message:m.id,p_title:null}); if(error) return; t={threadId:data.id,count:data.reply_count}; rootThreads.set(m.id,t); const el=$('th-'+m.id); if(el){el.style.display='';} }
  panelThread={id:t.threadId,root:m}; panelMode='thread';
  $('panel').classList.remove('hidden'); $('panelTitle').textContent='Thread'; $('panelFooter').classList.remove('hidden');
  const {data:tm}=await sb.rpc('get_thread_messages',{p_thread:t.threadId});
  const c=$('panelContent'); c.innerHTML='';
  const rootWho=profiles.get(m.author_id)?.display_name||'someone';
  c.innerHTML=`<div class="msg" style="border-bottom:1px solid var(--line);padding-bottom:8px"><span class="who">${esc(rootWho)}</span><span class="t">${timeOf(m.created_at)}</span><div class="body">${fmt(m.body_text)}</div></div><div class="muted" style="margin:6px 0">${(tm||[]).length-1} replies</div>`;
  (tm||[]).filter(x=>x.id!==m.id).forEach(appendThreadMsg);
}
function appendThreadMsg(m){ if(panelMode!=='thread') return; const who=profiles.get(m.author_id)?.display_name||'someone';
  const el=document.createElement('div'); el.className='msg'; el.innerHTML=`<span class="who">${esc(who)}</span><span class="t">${timeOf(m.created_at)}</span><div class="body">${fmt(m.body_text)}</div>`;
  $('panelContent').appendChild(el); $('panelContent').scrollTop=$('panelContent').scrollHeight; }
$('threadComposer').addEventListener('keydown',async e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); const t=$('threadComposer').value.trim(); if(!t||!panelThread) return; $('threadComposer').value='';
  await sb.rpc('send_message',{p_channel:current.id,p_client_msg_id:crypto.randomUUID(),p_body:{text:t},p_body_text:t,p_mentions:resolveMentions(t),p_mention_scope:'none',p_reply_to:null,p_thread:panelThread.id}); } });
function closePanel(){ panelMode=null; panelThread=null; $('panel').classList.add('hidden'); $('panelFooter').classList.add('hidden'); }
$('panelClose').onclick=closePanel;

// ---------------- search / pins / members panels ----------------
$('btnSearch').onclick=async()=>{ const q=prompt('Search messages'); if(!q) return; panelMode='search'; $('panel').classList.remove('hidden'); $('panelFooter').classList.add('hidden'); $('panelTitle').textContent='Search: '+q;
  const {data,error}=await sb.rpc('search_messages',{p_query:q,p_workspace:ws.id,p_limit:30}); const c=$('panelContent');
  if(error){ c.innerHTML=`<div class="muted">${esc(error.message)}</div>`; return; }
  c.innerHTML=(data||[]).length?'' : '<div class="muted">No results</div>';
  (data||[]).forEach(r=>{ const who=profiles.get(r.author_id)?.display_name||'someone'; const ch=channels.find(x=>x.id===r.channel_id);
    const el=document.createElement('div'); el.className='sr'; el.innerHTML=`<div class="muted">${esc(who)} in #${esc(ch?.name||'?')}</div><div>${fmt(r.body_text)}</div>`;
    el.onclick=()=>{ if(ch) openChannel(ch); }; c.appendChild(el); }); };
$('btnPins').onclick=async()=>{ if(!current) return; panelMode='pins'; $('panel').classList.remove('hidden'); $('panelFooter').classList.add('hidden'); $('panelTitle').textContent='Pinned';
  const {data}=await sb.from('pins').select('message_id').eq('channel_id',current.id); const ids=(data||[]).map(p=>p.message_id); const c=$('panelContent');
  if(!ids.length){ c.innerHTML='<div class="muted">No pins yet</div>'; return; }
  const {data:msgs}=await sb.from('messages').select('*').in('id',ids); c.innerHTML='';
  (msgs||[]).forEach(m=>{ const who=profiles.get(m.author_id)?.display_name||'someone'; const el=document.createElement('div'); el.className='sr'; el.innerHTML=`<div class="muted">${esc(who)}</div><div>${fmt(m.body_text)}</div>`; c.appendChild(el); }); };
$('btnMembers').onclick=async()=>{ panelMode='members'; $('panel').classList.remove('hidden'); $('panelFooter').classList.add('hidden'); $('panelTitle').textContent='Members'; renderMembersPanel(); };
function renderMembersPanel(){ if(panelMode!=='members') return; const c=$('panelContent'); c.innerHTML='';
  [...profiles.values()].forEach(p=>{ const el=document.createElement('div'); el.className='member';
    el.innerHTML=`<span class="dot" style="background:${online.has(p.id)?'var(--green)':'#555'}"></span>${esc(p.display_name||p.username||'user')}`;
    el.onclick=()=>{ if(p.id!==me) startDM(p.id); }; c.appendChild(el); }); }

// ---------------- DMs ----------------
async function newDM(){ const others=[...profiles.values()].filter(p=>p.id!==me); if(!others.length) return alert('No one else here yet - open a second tab'); startDM(others[0].id); }
async function startDM(userId){ const {data,error}=await sb.rpc('create_dm',{p_workspace:ws.id,p_users:[userId]}); if(error) return; openDM(data.id); renderChannels(); }
async function openDM(convId){ current=null; currentDM=convId; closePanel(); seen.clear();
  const other=await dmOther(convId); $('hdr').textContent='@ '+other; $('hdrtopic').textContent=''; $('composer').placeholder='Message '+other; renderChannels();
  const {data:msgs}=await sb.from('dm_messages').select('*').eq('conversation_id',convId).order('seq').limit(50); $('messages').innerHTML='';
  (msgs||[]).forEach(renderDM); scrollDown();
  if(dmSub) sb.removeChannel(dmSub); dmSub=sb.channel('dm:'+convId,{config:{private:true}});
  dmSub.on('broadcast',{event:'msg'},({payload})=>{ if(currentDM===convId) { renderDM(payload); scrollDown(); } }); dmSub.subscribe();
}
function renderDM(m){ const nonce=m.client_msg_id; if(nonce&&seen.has('n:'+nonce)){ const ex=$('m'+nonce); if(ex&&m.id) ex.id='m'+m.id; if(m.id) seen.add(m.id); return; }
  if(m.id&&seen.has(m.id)) return; if(m.id) seen.add(m.id); if(nonce) seen.add('n:'+nonce);
  const who=profiles.get(m.author_id)?.display_name||'someone'; const el=document.createElement('div'); el.className='msg'+(m.author_id===me?' me':''); if(m.id) el.id='m'+m.id;
  el.innerHTML=`<span class="who">${esc(who)}</span><span class="t">${timeOf(m.created_at)}</span><div class="body">${fmt(m.body_text)}</div>`; $('messages').appendChild(el); }

// ---------------- composer + mentions ----------------
const composer=$('composer');
composer.addEventListener('keydown',e=>{ if($('pop').dataset.mention&&(e.key==='Enter'||e.key==='Tab')){ e.preventDefault(); pickMention(); return; }
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
let lastTyping=0;
composer.addEventListener('input',()=>{ const now=Date.now(); if(typSub&&now-lastTyping>1500){ lastTyping=now; typSub.send({type:'broadcast',event:'typing',payload:{name:profiles.get(me)?.display_name||'someone'}}); }
  const m=composer.value.slice(0,composer.selectionStart).match(/@(\w*)$/); if(m) showMention(m[1]); else hideMention(); });
function showMention(q){ const p=$('pop'); const list=[...profiles.values()].filter(x=>x.id!==me&&((x.display_name||'').toLowerCase().includes(q.toLowerCase())||(x.username||'').toLowerCase().includes(q.toLowerCase()))).slice(0,6);
  if(!list.length) return hideMention(); p.dataset.mention='1'; p.classList.remove('hidden'); p.style.left='12px';
  p.innerHTML=list.map((x,i)=>`<div class="mrow ${i===0?'sel':''}" data-u="${x.username||x.display_name}">${esc(x.display_name||x.username)}</div>`).join('');
  p.querySelectorAll('.mrow').forEach(el=>el.onclick=()=>{ insertMention(el.dataset.u); }); }
function hideMention(){ const p=$('pop'); delete p.dataset.mention; if(!p.querySelector('.emoji')) p.classList.add('hidden'); }
function pickMention(){ const sel=$('pop').querySelector('.mrow.sel')||$('pop').querySelector('.mrow'); if(sel) insertMention(sel.dataset.u); }
function insertMention(u){ composer.value=composer.value.replace(/@(\w*)$/,'@'+u+' '); hideMention(); composer.focus(); }
function resolveMentions(text){ const out=[]; const by=new Map();
  for(const p of profiles.values()){ if(p.username) by.set(('@'+p.username).toLowerCase(),p.id); if(p.display_name) by.set(('@'+p.display_name).toLowerCase(),p.id); }
  (text.match(/@[\w]+/g)||[]).forEach(t=>{ const id=by.get(t.toLowerCase()); if(id&&!out.includes(id)) out.push(id); }); return out; }
async function send(){ const text=composer.value.trim(); if(!text) return; composer.value=''; hideMention();
  if(currentDM){ const nonce=crypto.randomUUID(); seen.add('n:'+nonce);
    const el=document.createElement('div'); el.className='msg me pending'; el.id='m'+nonce; el.innerHTML=`<span class="who">${esc(profiles.get(me)?.display_name||'you')}</span><span class="t">now</span><div class="body">${fmt(text)}</div>`; $('messages').appendChild(el); scrollDown();
    const {data,error}=await sb.rpc('send_dm',{p_conversation:currentDM,p_client_msg_id:nonce,p_body:{text},p_body_text:text}); if(!error&&data){ const e3=$('m'+nonce); if(e3){e3.classList.remove('pending'); e3.id='m'+data.id;} seen.add(data.id); } return; }
  if(!current) return; const mentions=resolveMentions(text); const nonce=crypto.randomUUID(); seen.add('n:'+nonce);
  const el=document.createElement('div'); el.className='msg me pending'; el.id='m'+nonce;
  el.innerHTML=`<span class="who">${esc(profiles.get(me)?.display_name||'you')}</span><span class="t">now</span><div class="body">${fmt(text)}</div><div class="rxns" id="rx-${nonce}"></div>`; $('messages').appendChild(el); scrollDown();
  const {data,error}=await sb.rpc('send_message',{p_channel:current.id,p_client_msg_id:nonce,p_body:{text},p_body_text:text,p_mentions:mentions,p_mention_scope:'none',p_reply_to:null,p_thread:null});
  if(error){ const e2=$('m'+nonce); if(e2) e2.querySelector('.body').innerHTML+=` <span class="edited" style="color:#ff8080">(${esc(error.message)})</span>`; return; }
  // replace the simplified optimistic node with a full render (with action buttons + reactions)
  const a=$('m'+nonce); if(a) a.remove(); const b=$('m'+data.id); if(b) b.remove();
  seen.delete('n:'+nonce); seen.delete(data.id);
  renderMsg(data); scrollDown();
}
function scrollDown(){ const m=$('messages'); m.scrollTop=m.scrollHeight; }
let typingTimer; function showTyping(name){ $('typing').textContent=name+' is typing...'; clearTimeout(typingTimer); typingTimer=setTimeout(()=>$('typing').textContent='',2500); }

// ---------------- presence ----------------
const online=new Set();
function subUser(token){ if(userSub) sb.removeChannel(userSub); userSub=sb.channel('user:'+me,{config:{private:true}});
  userSub.on('broadcast',{event:'mention'},()=>renderChannels()); userSub.subscribe(); }
async function heartbeat(){ const beat=async()=>{ try{ await sb.rpc('heartbeat',{p_status:'online'}); }catch{} }; beat(); setInterval(beat,45000); }
async function presenceLoop(){ const tick=async()=>{ const ids=[...profiles.keys()]; if(!ids.length) return;
    const {data}=await sb.from('user_presence').select('user_id,status,last_seen_at').in('user_id',ids); online.clear();
    (data||[]).forEach(p=>{ if(Date.now()-new Date(p.last_seen_at).getTime()<90000&&p.status!=='offline') online.add(p.user_id); }); online.add(me);
    $('onlineCount').textContent=online.size; renderMembersPanel(); };
  tick(); setInterval(async()=>{ await loadMembers(); tick(); },20000); }

// ---------------- VOICE (WebRTC mesh over Supabase signaling) ----------------
const voice={active:false, channel:null, sig:null, local:null, peers:new Map(), muted:false, parts:{}};
const RTC={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
async function joinVoice(c){ if(!c) return; if(voice.active&&voice.channel?.id===c.id) return; if(voice.active) leaveVoice();
  try{ voice.local=await navigator.mediaDevices.getUserMedia({audio:true,video:false}); }catch(e){ alert('Mic permission needed for voice'); return; }
  voice.active=true; voice.channel=c; $('voicebar').classList.remove('hidden'); $('vchanName').textContent=c.name;
  await sb.rpc('join_voice',{p_channel:c.id});
  voice.sig=sb.channel('vc:'+c.id,{config:{private:true,broadcast:{self:false}}});
  voice.sig.on('broadcast',{event:'signal'},({payload})=>onSignal(payload)); await voice.sig.subscribe();
  // connect to everyone already in the channel (deterministic offerer = smaller id)
  const {data:parts}=await sb.from('voice_participants').select('user_id').eq('channel_id',c.id);
  for(const p of (parts||[])){ if(p.user_id!==me && me<p.user_id) makePeer(p.user_id,true); }
  refreshVoice();
}
function makePeer(peerId,initiator){ if(voice.peers.has(peerId)) return voice.peers.get(peerId);
  const pc=new RTCPeerConnection(RTC); voice.peers.set(peerId,pc);
  voice.local.getTracks().forEach(t=>pc.addTrack(t,voice.local));
  pc.onicecandidate=e=>{ if(e.candidate) sig(peerId,{kind:'ice',data:e.candidate}); };
  pc.ontrack=e=>{ let a=$('a-'+peerId); if(!a){ a=document.createElement('audio'); a.id='a-'+peerId; a.autoplay=true; document.body.appendChild(a);} a.srcObject=e.streams[0]; monitorSpeaking(peerId,e.streams[0]); };
  pc.onconnectionstatechange=()=>{ if(['failed','closed','disconnected'].includes(pc.connectionState)) dropPeer(peerId); refreshVoice(); };
  if(initiator){ pc.createOffer().then(o=>{ pc.setLocalDescription(o); sig(peerId,{kind:'offer',data:o}); }); }
  return pc;
}
async function onSignal(p){ if(p.to!==me) return; const from=p.from;
  if(p.kind==='offer'){ const pc=makePeer(from,false); await pc.setRemoteDescription(p.data); const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); sig(from,{kind:'answer',data:ans}); }
  else if(p.kind==='answer'){ const pc=voice.peers.get(from); if(pc) await pc.setRemoteDescription(p.data); }
  else if(p.kind==='ice'){ const pc=voice.peers.get(from); if(pc) try{ await pc.addIceCandidate(p.data); }catch{} }
  else if(p.kind==='bye'){ dropPeer(from); }
}
function sig(to,msg){ voice.sig?.send({type:'broadcast',event:'signal',payload:{from:me,to,...msg}}); }
function dropPeer(id){ const pc=voice.peers.get(id); if(pc){ pc.close(); voice.peers.delete(id);} const a=$('a-'+id); if(a) a.remove(); const m=speakMon.get(id); if(m){cancelAnimationFrame(m.raf); speakMon.delete(id);} }
async function leaveVoice(){ if(!voice.active) return; [...voice.peers.keys()].forEach(id=>{ sig(id,{kind:'bye'}); dropPeer(id); });
  if(voice.sig) sb.removeChannel(voice.sig); if(voice.local) voice.local.getTracks().forEach(t=>t.stop());
  await sb.rpc('leave_voice',{p_channel:voice.channel.id}); voice.active=false; voice.channel=null; voice.local=null; $('voicebar').classList.add('hidden'); refreshVoice(); }
$('vleave').onclick=leaveVoice;
$('vmute').onclick=()=>{ voice.muted=!voice.muted; voice.local?.getAudioTracks().forEach(t=>t.enabled=!voice.muted); $('vmute').textContent=voice.muted?'Unmute':'Mute'; };
async function refreshVoice(){ // update participant chips + who is in each voice channel
  const vids=channels.filter(c=>c.kind==='voice').map(c=>c.id); if(vids.length){ const {data}=await sb.from('voice_participants').select('channel_id,user_id').in('channel_id',vids);
    voice.parts={}; (data||[]).forEach(r=>{ (voice.parts[r.channel_id]=voice.parts[r.channel_id]||[]).push(r.user_id); }); updateVoiceCounts(); }
  if(voice.active){ const ids=voice.parts[voice.channel.id]||[]; $('vparts').innerHTML=ids.map(u=>`<span class="vpart" id="vp-${u}">${esc(profiles.get(u)?.display_name||'user')}${u===me?' (you)':''}</span>`).join('');
    // ensure peer connections exist for anyone new
    ids.forEach(u=>{ if(u!==me&&!voice.peers.has(u)&&me<u) makePeer(u,true); }); }
}
function updateVoiceCounts(){ channels.filter(c=>c.kind==='voice').forEach(c=>{ const el=$('vlive-'+c.id); if(el){ const n=(voice.parts[c.id]||[]).length; el.textContent=n?`● ${n}`:''; } }); }
const speakMon=new Map();
function monitorSpeaking(id,stream){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const src=ac.createMediaStreamSource(stream); const an=ac.createAnalyser(); an.fftSize=256; src.connect(an); const buf=new Uint8Array(an.frequencyBinCount);
  const loop=()=>{ an.getByteFrequencyData(buf); const v=buf.reduce((a,b)=>a+b,0)/buf.length; const el=$('vp-'+id); if(el) el.classList.toggle('speaking',v>18); const raf=requestAnimationFrame(loop); speakMon.set(id,{raf}); };
  loop(); }catch{} }

// resume session
(async()=>{ const {data:{session}}=await sb.auth.getSession(); if(session) enter(); })();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(currentDM) openDM(currentDM); else if(current) openChannel(current); } });
</script>
